version: 2
updates:
  # Next.js / backend and any root package.json
  - package-ecosystem: npm
    directories: ["/", "/apps/*", "/packages/*", "/web", "/backend"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, security]

  # Keeps the SHA-pinned actions in .github/workflows current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, security]
