# Security scanning for 101 Codecrafts members-site.
# Free for public repos (CodeQL + code scanning). Actions are pinned to full commit SHAs
# (supply-chain hardening); Dependabot keeps the pins current.
name: security

on:
  push:
    branches: [main, backend, security]
  pull_request:
  schedule:
    - cron: "23 3 * * 1" # weekly, Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JS/TS + Actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks-action needs a paid licence for organisation repos, so run the
      # pinned OSS binary directly and verify its checksum.
      - name: Install gitleaks
        env:
          GL_VERSION: "8.21.2"
          GL_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          tgz="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tgz" "$base/$tgz"
          echo "${GL_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--all" .

  trufflehog:
    name: Secret scan (TruffleHog, full history, all branches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every branch
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install TruffleHog (pinned, checksum-verified)
        env:
          TH_VERSION: "3.99.7"
          TH_SHA256: "bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef"
        run: |
          set -euo pipefail
          tgz="trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}/${tgz}"
          echo "${TH_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "$tgz" trufflehog
      - name: Verified secrets (fail the build)
        run: ./trufflehog git file://. --only-verified --fail --no-update
      - name: Unverified + unknown secrets (report only)
        run: ./trufflehog git file://. --results=unverified,unknown --no-update --json > trufflehog-unverified.json || true
      - name: Summarise unverified findings
        run: |
          n=$(wc -l < trufflehog-unverified.json)
          echo "TruffleHog unverified/unknown findings: $n" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" = 0 ] || echo "::warning::TruffleHog found $n unverified/unknown candidate secrets; review and rotate if real."

  deps:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (every package-lock.json, high+ fails)
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r lock; do
            found=1
            dir=$(dirname "$lock")
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --audit-level=high --omit=dev)
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path "*/node_modules/*")
          [ "$found" = 1 ] || echo "No package-lock.json yet; skipping npm audit."

  osv:
    name: OSV-Scanner
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        -r
        ./
