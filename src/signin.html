<!doctype html>
<html lang="en">
<head>

</head>
<body class="flow" data-page="signin">
<a class="skip" href="#main">Skip to content</a>
{{ICONS}}
<main id="main" class="center">
<div class="panel-x">
<a class="brandbar" href="index.html"><img src="assets/img/logo-101-header.webp" srcset="assets/img/logo-101-header.webp 1x, assets/img/logo-101-header@3x.webp 3x" alt="" width="82" height="41"><b>Codecrafts</b></a>

<h1>WELCOME BACK</h1>
<form id="si" class="grid" style="gap:12px">
 <label class="field">Email or phone<input name="email" type="text" autocomplete="username" required></label>
 <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
 <button class="btn or">Sign in</button>
 <button class="btn" type="button" id="si-google">Continue with Google</button>
 <p class="muted">New here? <a href="signup.html"><b>Create an account</b></a></p><p id="si-msg" role="status" aria-live="polite"></p>
</form>
</div>
</main>
{{SCRIPTS}}
<script src="js/pages.js" defer></script>
